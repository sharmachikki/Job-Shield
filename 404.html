<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>404 — Not Found</title>
</head>
<body>
  <script>
    // GitHub Pages SPA fallback: load index.html content so client-side routes work.
    (function(){
      fetch('/index.html').then(r=>r.text()).then(html=>{
        document.open(); document.write(html); document.close();
        // keep the original URL so SPA router can inspect it
        history.replaceState({}, '', location.pathname);
      }).catch(()=>{
        document.body.innerHTML = '<h1>404 — Not Found</h1><p>The page was not found.</p>';
      });
    })();
  </script>
</body>
</html>
