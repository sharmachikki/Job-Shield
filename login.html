<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in — Job Easy</title>
  <style>body{font-family:Inter,system-ui;margin:40px;color:#14213D;background:#FAF8F3}.container{max-width:420px;margin:0 auto;padding:0 20px}label{display:block;margin-top:12px}input{width:100%;padding:8px;border:1px solid #ddd}</style>
</head>
<body>
  <div class="container">
    <a href="/index.html">← Home</a>
    <h1>Log in</h1>
    <form id="loginForm">
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" required></label>
      <button type="submit" style="margin-top:12px;padding:10px 14px">Log in</button>
    </form>
    <div id="loginMsg" style="color:var(--slate);margin-top:10px"></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const msg = document.getElementById('loginMsg'); msg.textContent='Logging in...';
      const form = e.target; const payload = { email: form.email.value, password: form.password.value };
      try{
        const res = await fetch('/api/v1/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if(!res.ok){ msg.textContent = data.message || 'Login failed'; return; }
        // store access token in localStorage for demo (use httpOnly cookies in prod)
        localStorage.setItem('accessToken', data.accessToken || data.accessToken);
        msg.textContent = 'Login successful — redirecting...';
        setTimeout(()=> location.href='/index.html', 800);
      }catch(err){ console.error(err); msg.textContent = 'Unable to reach API. Try again later.' }
    });
  </script>
</body>
</html>
