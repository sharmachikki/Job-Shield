<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Job Easy</title>
  <style>body{font-family:Inter,system-ui;margin:40px;color:#14213D;background:#FAF8F3}.container{max-width:700px;margin:0 auto;padding:0 20px}label{display:block;margin-top:12px}input,textarea{width:100%;padding:8px;margin-top:6px;border:1px solid #ddd}</style>
</head>
<body>
  <div class="container">
    <a href="/index.html">← Home</a>
    <h1>Contact</h1>
    <p>If you have questions or want to partner, email <strong>support@jobeasy.example</strong>.</p>
    <form action="https://formspree.io/f/yourform" method="POST">
      <label>Name<input type="text" name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Message<textarea name="message" rows="6" required></textarea></label>
      <button type="submit" style="margin-top:12px;padding:10px 14px">Send</button>
    </form>
  </div>
</body>
</html>
