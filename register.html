<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — Job Easy</title>
  <style>body{font-family:Inter,system-ui;margin:40px;color:#14213D;background:#FAF8F3}.container{max-width:480px;margin:0 auto;padding:0 20px}label{display:block;margin-top:12px}input{width:100%;padding:8px;border:1px solid #ddd}</style>
</head>
<body>
  <div class="container">
    <a href="/index.html">← Home</a>
    <h1>Create an account</h1>
    <form id="registerForm">
      <label>Full name<input name="fullName" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Phone<input name="phone"></label>
      <label>Password<input name="password" type="password" required></label>
      <label>Role<select name="role"><option value="JOB_SEEKER">Job Seeker</option><option value="EMPLOYER">Employer</option></select></label>
      <button type="submit" style="margin-top:12px;padding:10px 14px">Register</button>
    </form>
    <div id="regMsg" style="color:var(--slate);margin-top:10px"></div>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const msg = document.getElementById('regMsg'); msg.textContent='Registering...';
      const f = e.target; const payload = { fullName: f.fullName.value, email: f.email.value, phone: f.phone.value, password: f.password.value, role: f.role.value };
      try{
        const res = await fetch('/api/v1/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if(!res.ok){ msg.textContent = data.message || 'Registration failed'; return; }
        msg.textContent = 'Registration successful — redirecting to home...';
        setTimeout(()=> location.href = '/index.html', 900);
      }catch(err){ console.error(err); msg.textContent = 'Unable to reach API. Try again later.' }
    });
  </script>
</body>
</html>
